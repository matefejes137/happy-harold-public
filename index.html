<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Harold</title>
<meta name="description" content="Happy Harold – a relaxing physics puzzle game about a jellyfish who needs the right colours.">
<style>
:root { --bg:#eaf6fb; --card:#ffffff; --text:#12202b; --muted:#4a5d6b; --accent:#1a8fc4; --line:#d5e8f1; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#06141f; --card:#0b1f2e; --text:#e6f1f7; --muted:#9fb6c4; --accent:#5fc9f0; --line:#16344a; }
}
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width:760px; margin:0 auto; padding:48px 16px 64px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 24px; }
h1 { font-size:32px; line-height:1.2; margin:0 0 8px; }
p { margin:0 0 14px; }
a { color:var(--accent); }
ul { padding-left:22px; }
footer { text-align:center; color:var(--muted); font-size:13px; margin-top:20px; }
</style>
</head>
<body>
<main>
<div class="card">
<h1>🪼 Happy Harold</h1>
<p>A relaxing physics puzzle game for Android. Feed Harold the jellyfish the right colours, merge plankton and dive from the sunny shallows down to the Abyss.</p>
<ul>
<li><a href="privacy/">Privacy policy</a></li>
</ul>
</div>
<footer>Happy Harold</footer>
</main>
</body>
</html>
